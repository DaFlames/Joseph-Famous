<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academic Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="logo">JOSEPH FAMOUS</div>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Me</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="planner.html">Planner</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="planner-box card">
      <h2>Interactive Academic Planner</h2>
      <p style="margin-bottom: 1rem;">Keep track of your study targets, module deadlines, and course goals.</p>

      <!-- Input Group to Add Task -->
      <div class="input-group">
        <input type="text" id="task-input" placeholder="Enter a task (e.g. Study COS 106 Module 4)...">
        <button id="add-task-btn">Add Task</button>
      </div>

      <!-- Live Tasks will generate inside this list dynamically using JavaScript -->
      <ul id="task-list-container" class="task-list"></ul>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 MIVA Open University | Sponsored By Arxia Core</p>
  </footer>

  <!-- Link the JS script -->
  <script src="script.js"></script>
</body>
</html>
