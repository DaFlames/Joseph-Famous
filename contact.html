<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="logo">JOSEPH FAMOUS</div>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Me</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="planner.html">Planner</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="planner-box card">
      <h2>Get In Touch</h2>
      <p style="margin-bottom: 1.5rem;">Fill out this form to send me a direct message. All fields are required!</p>

      <form id="contact-form" novalidate>
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" placeholder="Your full name">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="example@domain.com">
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="text" id="phone" placeholder="Digits only (e.g., 08012345678)">
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" rows="5" placeholder="Write your message here..."></textarea>
        </div>

        <button type="submit">Send Message</button>
      </form>

      <!-- Div for displaying errors or validation status -->
      <div id="error-box" class="error-message"></div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 MIVA Open University | Sponsored By Arxia Core</p>
  </footer>

  <!-- Link the JS script -->
  <script src="script.js"></script>
</body>
</html>
